name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Buat folder android
        run: flutter create . --platforms=android --org com.sabila313 --project-name sabila313
      - name: Atur AndroidManifest
        run: python3 .github/scripts/patch_android_manifest.py android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sabila313-apk
          path: build/app/outputs/flutter-apk/app-release.apk
